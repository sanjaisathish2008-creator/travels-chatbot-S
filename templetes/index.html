<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: rgba(255, 255, 255, 0.94);
            --text: #172033;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2563eb;
            --accent-dark: #1d4ed8;
            --user: #2563eb;
            --assistant: #ffffff;
            --shadow: 0 20px 60px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(37, 99, 235, 0.13), transparent 34%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.12), transparent 30%),
                var(--bg);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: min(1050px, 100%);
            height: calc(100vh - 40px);
            min-height: 560px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.82);
        }

        .logo {
            width: 46px;
            height: 46px;
            flex: 0 0 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb, #0ea5e9);
            color: white;
            font-size: 23px;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
        }

        .heading h1 {
            margin: 0;
            font-size: 18px;
            line-height: 1.25;
        }

        .heading p {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px clamp(16px, 4vw, 48px);
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 700px;
            margin: 7vh auto 0;
            text-align: center;
        }

        .welcome-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: #eff6ff;
            font-size: 30px;
        }

        .welcome h2 {
            margin: 0 0 8px;
            font-size: clamp(24px, 4vw, 34px);
        }

        .welcome p {
            margin: 0 auto;
            max-width: 600px;
            color: var(--muted);
            line-height: 1.6;
        }

        .message {
            display: flex;
            margin: 0 auto 18px;
            max-width: 850px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(78%, 720px);
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 15px;
        }

        .message.user .bubble {
            color: white;
            background: var(--user);
            border-bottom-right-radius: 6px;
        }

        .message.assistant .bubble {
            background: var(--assistant);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
            padding: 13px 16px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: white;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #94a3b8;
            animation: bounce 1.1s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: .15s; }
        .dot:nth-child(3) { animation-delay: .3s; }

        @keyframes bounce {
            0%, 70%, 100% { transform: translateY(0); opacity: .5; }
            35% { transform: translateY(-5px); opacity: 1; }
        }

        .composer {
            padding: 14px clamp(14px, 3vw, 30px) 18px;
            border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.9);
        }

        .input-wrap {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 9px 10px 9px 15px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: white;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
        }

        textarea {
            flex: 1;
            min-height: 44px;
            max-height: 140px;
            resize: none;
            border: 0;
            outline: 0;
            font: inherit;
            line-height: 1.45;
            color: var(--text);
            background: transparent;
            padding: 10px 0;
        }

        button {
            width: 44px;
            height: 44px;
            flex: 0 0 44px;
            border: 0;
            border-radius: 13px;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 19px;
            transition: .2s ease;
        }

        button:hover:not(:disabled) {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .55;
        }

        .hint {
            max-width: 850px;
            margin: 7px auto 0;
            color: #9ca3af;
            font-size: 11px;
            text-align: right;
        }

        .error {
            max-width: 850px;
            margin: 0 auto 14px;
            padding: 11px 13px;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #991b1b;
            background: #fef2f2;
            font-size: 13px;
        }

        @media (max-width: 640px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                min-height: 0;
                border-radius: 0;
                border: 0;
            }

            header {
                padding: 14px 16px;
            }

            #chat {
                padding: 20px 14px;
            }

            .bubble {
                max-width: 88%;
            }

            .welcome {
                margin-top: 10vh;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header>
        <div class="logo" aria-hidden="true">✈</div>
        <div class="heading">
            <h1 id="chatbot-title">{{ chatbot_title }}</h1>
            <p>Travel planning & destination information assistant</p>
        </div>
    </header>

    <main id="chat" aria-live="polite">
        <section class="welcome" id="welcome">
            <div class="welcome-icon">🌍</div>
            <h2>Plan your next journey</h2>
            <p>
                Ask about destinations, itineraries, transportation, activities,
                accommodation considerations, packing, and practical travel planning.
            </p>
        </section>
    </main>

    <div class="composer">
        <div id="error" class="error" hidden></div>
        <form id="chat-form" class="input-wrap">
            <textarea
                id="message"
                maxlength="4000"
                rows="1"
                placeholder="Ask a travel-related question..."
                aria-label="Message"
                required
            ></textarea>
            <button id="send" type="submit" aria-label="Send message">➤</button>
        </form>
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
    </div>
</div>

<script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const errorBox = document.getElementById("error");

    let history = [];
    let isSending = false;

    function scrollToBottom() {
        requestAnimationFrame(() => {
            chat.scrollTop = chat.scrollHeight;
        });
    }

    function showError(message) {
        errorBox.textContent = message;
        errorBox.hidden = false;
    }

    function clearError() {
        errorBox.textContent = "";
        errorBox.hidden = true;
    }

    function addMessage(role, content) {
        welcome.hidden = true;

        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = content;

        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        scrollToBottom();
    }

    function addTyping() {
        const wrapper = document.createElement("div");
        wrapper.className = "message assistant";
        wrapper.id = "typing-indicator";

        const typing = document.createElement("div");
        typing.className = "typing";
        typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

        wrapper.appendChild(typing);
        chat.appendChild(wrapper);
        scrollToBottom();
    }

    function removeTyping() {
        document.getElementById("typing-indicator")?.remove();
    }

    function resizeInput() {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            form.requestSubmit();
        }
    });

    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (isSending) return;

        const message = input.value.trim();
        if (!message) return;

        clearError();
        isSending = true;
        sendButton.disabled = true;
        input.disabled = true;

        addMessage("user", message);
        history.push({ role: "user", content: message });

        input.value = "";
        resizeInput();
        addTyping();

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message,
                    history
                })
            });

            const data = await response.json().catch(() => ({}));
            removeTyping();

            if (!response.ok) {
                throw new Error(data.error || "Unable to get a response.");
            }

            const reply = typeof data.reply === "string" ? data.reply.trim() : "";
            if (!reply) {
                throw new Error("The chatbot returned an empty response.");
            }

            addMessage("assistant", reply);
            history.push({ role: "assistant", content: reply });

            if (history.length > 20) {
                history = history.slice(-20);
            }
        } catch (error) {
            removeTyping();
            showError(error.message || "Something went wrong. Please try again.");
            history = history.slice(0, -1);
        } finally {
            isSending = false;
            sendButton.disabled = false;
            input.disabled = false;
            input.focus();
        }
    });

    input.focus();
</script>
</body>
</html>
